name: Editorial and rights checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate publish catalog and pronoun canon
        run: python3 scripts/check.py
      - name: Validate personal translator syntax and offline dry-run
        run: |
          python3 -m py_compile tools/personal_translate.py
          python3 tools/personal_translate.py tests/example-source.txt --chapter 137 --dry-run
      - name: Test private reader modules
        run: |
          node --check assets/personal.js
          node --check assets/personal-ui.mjs
          node --check assets/personal-core.mjs
          node --test tests/personal-reader.test.mjs
          python3 -m py_compile scripts/check_public_bundle.py
