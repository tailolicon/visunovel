name: Role 3 offline QA
on:
  push:
    paths: ['tools/role3_*.py', 'tests/test_role3_*.py']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_role3_*.py' -v
