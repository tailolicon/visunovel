name: Deploy visuNovel to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'personal.html'
      - 'assets/**'
      - 'data/**'
      - 'translation/canon.json'
      - 'scripts/check.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate editorial/legal publication gate
        run: python3 scripts/check.py
      - name: Assemble public-only files
        run: |
          mkdir -p public-build
          cp index.html personal.html public-build/
          cp -R assets data public-build/
          touch public-build/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-build
      - name: Deploy
        uses: actions/deploy-pages@v4
