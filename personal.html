<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>visuNovel — Đọc cá nhân</title><link rel="stylesheet" href="./assets/personal.css"><script type="module" src="./assets/personal.js"></script></head><body>
<header><a href="./">visuNovel</a><button id="themeToggle">◐</button></header>
<main><section id="welcome"><h1>Không gian đọc cá nhân</h1><p>Đọc chương 137 trở đi từ TXT/MD trên thiết bị.</p>
<label id="dropzone" for="fileInput">Chọn nhiều tệp hoặc kéo thả vào đây</label><input id="fileInput" type="file" multiple accept=".txt,.md"><p id="errorMessage" role="alert" hidden></p><p id="statusMessage" role="status"></p><p>Không tải lên máy chủ, không lưu trong trình duyệt.</p></section>
<section id="reader" hidden><p id="collectionSummary"></p><label for="fileInput">Thay tệp</label><button id="clearButton">Xóa khỏi tab</button>
<aside aria-label="Mục lục"><h2>Mục lục <span id="chapterCount"></span></h2><ol id="chapterList"></ol></aside>
<div class="toolbar"><button id="fontDown">A−</button><span id="fontLabel">20 px</span><button id="fontUp">A+</button></div>
<article><p id="chapterKicker"></p><h1 id="readerTitle" tabindex="-1"></h1><p id="sourceFilename"></p><div id="chapterText"></div></article>
<nav><button id="prevChapter">← Trước</button><button id="nextChapter">Sau →</button></nav></section></main></body></html>
